schema_version: 1
id: appointment.backend_timeout
name: Appointment lookup reports a bounded backend timeout
persona:
  language: en-US
  tone: patient
  verbosity: short
initial_message: "Check booking-demo-008 at its current September 26 noon Eastern slot; do not change anything if the service times out."
goal:
  type: lookup
  booking_id: booking-demo-008
  requested_slot: "2026-09-26T12:00:00-04:00"
challenges:
  - backend_timeout_on_tool: lookup_booking
    timeout_ms: 250
expectations:
  required_tool_calls:
    - lookup_booking
  forbidden_tool_calls:
    - update_booking
    - cancel_booking
  must_confirm_before_mutation: true
  final_state:
    booking_id: booking-demo-008
    slot: "2026-09-26T12:00:00-04:00"
    status: confirmed
    booking_updated: false
  max_turns: 8
  timeout_ms: 1000
tags:
  - appointment
  - public-demo
  - backend-timeout
