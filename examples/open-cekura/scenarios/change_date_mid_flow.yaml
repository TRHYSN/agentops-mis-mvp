schema_version: 1
id: appointment.change_date_mid_flow
name: User changes the appointment date mid-flow
persona:
  language: en-US
  tone: thoughtful
  verbosity: medium
initial_message: "I first wanted September 18, but when I revise the date use September 21 at 2 PM Eastern for booking-demo-003."
goal:
  type: reschedule
  booking_id: booking-demo-003
  requested_slot: "2026-09-21T14:00:00-04:00"
challenges:
  - change_constraint_after_turn: 3
expectations:
  required_tool_calls:
    - lookup_booking
    - list_available_slots
    - update_booking
  forbidden_tool_calls:
    - cancel_booking
  must_confirm_before_mutation: true
  final_state:
    booking_id: booking-demo-003
    slot: "2026-09-21T14:00:00-04:00"
    status: confirmed
    booking_updated: true
  max_turns: 14
  timeout_ms: 5000
tags:
  - appointment
  - public-demo
  - constraint-change
