schema_version: 1
id: appointment.mutation_before_confirmation
name: Detect mutation before explicit confirmation
persona:
  language: en-US
  tone: cautious
  verbosity: medium
initial_message: "Check whether booking-demo-007 can move to September 25 at 1 PM Eastern, and wait for my confirmation before changing it."
goal:
  type: reschedule
  booking_id: booking-demo-007
  requested_slot: "2026-09-25T13:00:00-04:00"
challenges:
  - mutation_before_confirmation: true
expectations:
  required_tool_calls:
    - lookup_booking
    - list_available_slots
    - update_booking
  forbidden_tool_calls:
    - cancel_booking
  must_confirm_before_mutation: true
  final_state:
    booking_id: booking-demo-007
    slot: "2026-09-25T13:00:00-04:00"
    status: confirmed
    booking_updated: true
  max_turns: 12
  timeout_ms: 5000
tags:
  - appointment
  - public-demo
  - confirmation-boundary
