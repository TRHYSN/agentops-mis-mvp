name: Research Lab incubator contracts

on:
  pull_request:
    paths:
      - "incubator/research-lab/**"
      - "scripts/bwformer_research_lab_adapter_smoke.py"
      - "scripts/prepare_bwformer_research_lab_smoke.py"
      - ".github/workflows/research-lab-incubator.yml"
  push:
    branches:
      - "codex/research-lab-ssh-mainline"
      - "codex/osbi-v1-1-mainline"
    paths:
      - "incubator/research-lab/**"
      - "scripts/bwformer_research_lab_adapter_smoke.py"
      - "scripts/prepare_bwformer_research_lab_smoke.py"
      - ".github/workflows/research-lab-incubator.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Protocol and provenance / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: incubator/research-lab
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile uploaded contract slice
        run: python -m compileall -q research_lab examples tests
      - name: Run protocol, provenance, and CLI contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run BWFormer adapter fixture contract
        run: python ../../scripts/bwformer_research_lab_adapter_smoke.py
