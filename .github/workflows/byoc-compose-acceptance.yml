name: BYOC Docker Compose Acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentops-byoc-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-acceptance:
    name: Clean install, restore drill, and same-schema image lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: agentops-byoc-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact caller commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Declare acceptance scope
        run: |
          echo "::notice title=BYOC acceptance scope::Validates a clean Compose build/start, production TypeScript/PostgreSQL readiness, committed backup and isolated restore, plus backup-authoritative retained-data apply/rollback between two exact-source images with identical rootfs content and different build identities. This same-schema image lifecycle does not validate image upgrade or rollback across schema versions."

      - name: Create ephemeral BYOC configuration
        run: |
          set -euo pipefail
          umask 077

          byoc_root="${RUNNER_TEMP}/agentops-byoc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          secrets_dir="${byoc_root}/secrets"
          env_file="${byoc_root}/.env"
          backup_bundle="${byoc_root}/acceptance-backup.bundle"
          restore_database="agentops_restore_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          registry="localhost:5000"
          image_repository="${registry}/agentops-mis-byoc"
          source_image_tag="${image_repository}:source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_image_tag="${image_repository}:target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry_container="agentops-byoc-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          lifecycle_state_dir="${byoc_root}/lifecycle-state"
          authority_id="audit_byoc_authority_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          probe_id="audit_byoc_post_apply_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          install -d -m 700 "${byoc_root}" "${secrets_dir}"
          openssl rand -hex 32 > "${secrets_dir}/postgres-migrator-password"
          openssl rand -hex 32 > "${secrets_dir}/postgres-runtime-password"
          openssl rand -hex 32 > "${secrets_dir}/postgres-entitlement-admin-password"
          openssl rand -base64 32 > "${secrets_dir}/entitlement-operator-password"
          openssl rand -hex 32 > "${secrets_dir}/human-session-hmac-key"
          chmod 600 "${secrets_dir}"/*

          {
            printf 'AGENTOPS_IMAGE=%s\n' "${source_image_tag}"
            printf 'AGENTOPS_BUILD_IDENTITY=source-%s-%s\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
            printf 'AGENTOPS_SOURCE_REVISION=%s\n' "${GITHUB_SHA}"
            printf 'AGENTOPS_BIND_ADDRESS=127.0.0.1\n'
            printf 'AGENTOPS_PORT=3001\n'
            printf 'AGENTOPS_ALLOWED_ORIGINS=http://127.0.0.1:3001\n'
            printf 'AGENTOPS_ENTITLEMENT_CONTROL_PLANE_URL=http://127.0.0.1:3001\n'
            printf 'AGENTOPS_ENTITLEMENT_CONTROL_PLANE_ORIGIN=http://127.0.0.1:3001\n'
            printf 'AGENTOPS_ENTITLEMENT_OPERATOR_USERNAME=owner\n'
            printf 'AGENTOPS_POSTGRES_DATABASE=agentops\n'
            printf 'AGENTOPS_POSTGRES_MIGRATOR_USER=agentops_migrator\n'
            printf 'AGENTOPS_POSTGRES_RUNTIME_USER=agentops_runtime\n'
            printf 'AGENTOPS_POSTGRES_ENTITLEMENT_ADMIN_USER=agentops_entitlement_admin\n'
            printf 'AGENTOPS_POSTGRES_MIGRATOR_PASSWORD_FILE=%s\n' \
              "${secrets_dir}/postgres-migrator-password"
            printf 'AGENTOPS_POSTGRES_RUNTIME_PASSWORD_FILE=%s\n' \
              "${secrets_dir}/postgres-runtime-password"
            printf 'AGENTOPS_POSTGRES_ENTITLEMENT_ADMIN_PASSWORD_FILE=%s\n' \
              "${secrets_dir}/postgres-entitlement-admin-password"
            printf 'AGENTOPS_ENTITLEMENT_OPERATOR_PASSWORD_FILE=%s\n' \
              "${secrets_dir}/entitlement-operator-password"
            printf 'AGENTOPS_HUMAN_SESSION_HMAC_KEY_FILE=%s\n' \
              "${secrets_dir}/human-session-hmac-key"
          } > "${env_file}"
          chmod 600 "${env_file}"

          {
            printf 'AGENTOPS_BYOC_ROOT=%s\n' "${byoc_root}"
            printf 'AGENTOPS_BYOC_ENV_FILE=%s\n' "${env_file}"
            printf 'AGENTOPS_BYOC_COMPOSE_FILE=deploy/byoc/compose.yaml\n'
            printf 'AGENTOPS_BYOC_BACKUP_BUNDLE=%s\n' "${backup_bundle}"
            printf 'AGENTOPS_BYOC_IMAGE=%s\n' "${source_image_tag}"
            printf 'AGENTOPS_RESTORE_DATABASE=%s\n' "${restore_database}"
            printf 'AGENTOPS_RESTORE_KEEP=false\n'
            printf 'AGENTOPS_BYOC_LIFECYCLE_STATE_DIR=%s\n' "${lifecycle_state_dir}"
            printf 'AGENTOPS_BYOC_SOURCE_IMAGE_TAG=%s\n' "${source_image_tag}"
            printf 'AGENTOPS_BYOC_TARGET_IMAGE_TAG=%s\n' "${target_image_tag}"
            printf 'AGENTOPS_BYOC_REGISTRY_CONTAINER=%s\n' "${registry_container}"
            printf 'AGENTOPS_BYOC_AUTHORITY_ID=%s\n' "${authority_id}"
            printf 'AGENTOPS_BYOC_POST_APPLY_PROBE_ID=%s\n' "${probe_id}"
          } >> "${GITHUB_ENV}"

      - name: Start ephemeral local image registry
        run: |
          set -euo pipefail
          docker run \
            --detach \
            --name "${AGENTOPS_BYOC_REGISTRY_CONTAINER}" \
            --publish 127.0.0.1:5000:5000 \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 1 \
            http://127.0.0.1:5000/v2/ > /dev/null

      - name: Validate Compose model without exposing configuration
        run: |
          set -euo pipefail
          docker compose \
            --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
            -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
            config --quiet

          services="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              config --services
          )"
          if grep -Eiq '(^|[-_])(python|sqlite)([-_]|$)' <<< "${services}"; then
            echo "unexpected Python or SQLite service in commercial BYOC topology" >&2
            exit 1
          fi

      - name: Build and publish two exact-source immutable images
        run: |
          set -euo pipefail
          source_identity="source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_identity="target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          AGENTOPS_IMAGE="${AGENTOPS_BYOC_SOURCE_IMAGE_TAG}" \
          AGENTOPS_BUILD_IDENTITY="${source_identity}" \
          AGENTOPS_SOURCE_REVISION="${GITHUB_SHA}" \
          timeout 20m docker compose \
            --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
            -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
            build --pull migrate
          docker push "${AGENTOPS_BYOC_SOURCE_IMAGE_TAG}" > /dev/null

          AGENTOPS_IMAGE="${AGENTOPS_BYOC_TARGET_IMAGE_TAG}" \
          AGENTOPS_BUILD_IDENTITY="${target_identity}" \
          AGENTOPS_SOURCE_REVISION="${GITHUB_SHA}" \
          timeout 20m docker compose \
            --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
            -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
            build migrate
          docker push "${AGENTOPS_BYOC_TARGET_IMAGE_TAG}" > /dev/null

          image_repository="localhost:5000/agentops-mis-byoc"
          source_digest="$(
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "${AGENTOPS_BYOC_SOURCE_IMAGE_TAG}" |
              grep -E "^${image_repository}@sha256:[0-9a-f]{64}$" |
              head -n 1
          )"
          target_digest="$(
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "${AGENTOPS_BYOC_TARGET_IMAGE_TAG}" |
              grep -E "^${image_repository}@sha256:[0-9a-f]{64}$" |
              head -n 1
          )"
          test -n "${source_digest}"
          test -n "${target_digest}"
          test "${source_digest}" != "${target_digest}"
          docker pull "${source_digest}" > /dev/null
          docker pull "${target_digest}" > /dev/null

          source_image_id="$(docker image inspect --format '{{.Id}}' "${source_digest}")"
          target_image_id="$(docker image inspect --format '{{.Id}}' "${target_digest}")"
          test "${source_image_id}" != "${target_image_id}"
          test "$(docker image inspect --format '{{json .RootFS.Layers}}' "${source_digest}")" = \
            "$(docker image inspect --format '{{json .RootFS.Layers}}' "${target_digest}")"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${source_digest}")" = \
            "${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${target_digest}")" = \
            "${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "io.agentops.byoc.build-identity"}}' "${source_digest}")" = \
            "${source_identity}"
          test "$(docker image inspect --format '{{index .Config.Labels "io.agentops.byoc.build-identity"}}' "${target_digest}")" = \
            "${target_identity}"

          temporary_env="${AGENTOPS_BYOC_ENV_FILE}.next"
          awk -v image="${source_digest}" '
            /^AGENTOPS_IMAGE=/ { print "AGENTOPS_IMAGE=" image; next }
            { print }
          ' "${AGENTOPS_BYOC_ENV_FILE}" > "${temporary_env}"
          chmod 600 "${temporary_env}"
          mv "${temporary_env}" "${AGENTOPS_BYOC_ENV_FILE}"

          {
            printf 'AGENTOPS_BYOC_SOURCE_IMAGE=%s\n' "${source_digest}"
            printf 'AGENTOPS_BYOC_TARGET_IMAGE=%s\n' "${target_digest}"
            printf 'AGENTOPS_BYOC_SOURCE_IMAGE_ID=%s\n' "${source_image_id}"
            printf 'AGENTOPS_BYOC_TARGET_IMAGE_ID=%s\n' "${target_image_id}"
          } >> "${GITHUB_ENV}"

      - name: Start clean BYOC control plane from source digest
        run: |
          set -euo pipefail
          timeout 10m docker compose \
            --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
            -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
            up --detach --no-build --wait --wait-timeout 300 control-plane

      - name: Verify real health and production boundary
        run: |
          set -euo pipefail
          health_receipt="${RUNNER_TEMP}/agentops-byoc-health.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 2 \
            --output "${health_receipt}" \
            http://127.0.0.1:3001/api/mis/health

          jq -e '
            .ok == true
            and .status == "ready"
            and .control_plane == "typescript_postgres"
            and (.schema_contract | type == "string" and length > 0)
            and .schema_ready == true
            and (.schema_fingerprint_contract | type == "string" and length > 0)
            and .schema_fingerprint_verified == true
            and .python_proxy_performed == false
            and .sqlite_used == false
            and .credentials_omitted == true
          ' "${health_receipt}" > /dev/null

          docker compose \
            --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
            -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
            exec -T control-plane sh -ceu '
              test "$AGENTOPS_DEPLOYMENT_MODE" = production
              test "$AGENTOPS_CONTROL_PLANE_MODE" = postgres
              test -z "${AGENTOPS_POSTGRES_MIGRATOR_HOST:-}"
              test ! -e /opt/agentops/server.py
            '

          running_services="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              ps --services --status running |
              sort
          )"
          test "${running_services}" = $'control-plane\npostgres'
          echo "::notice title=BYOC production boundary::TypeScript/PostgreSQL health, manifest, schema fingerprint, restricted runtime startup, and absence of a Python/SQLite service path verified."

      - name: Create and verify committed backup bundle
        run: |
          set -euo pipefail
          backup_receipt="${RUNNER_TEMP}/agentops-byoc-backup.json"
          timeout 5m deploy/byoc/backup.sh \
            "${AGENTOPS_BYOC_BACKUP_BUNDLE}" > "${backup_receipt}"
          jq -e '
            .ok == true
            and .contract == "agentops_byoc_backup_v2"
            and .bundle_committed == true
            and .backup_created == true
            and .checksum_created == true
            and .credentials_omitted == true
          ' "${backup_receipt}" > /dev/null
          test -s "${AGENTOPS_BYOC_BACKUP_BUNDLE}/database.dump"
          test -s "${AGENTOPS_BYOC_BACKUP_BUNDLE}/SHA256SUMS"
          test "$(
            cat "${AGENTOPS_BYOC_BACKUP_BUNDLE}/COMMITTED"
          )" = "agentops_byoc_backup_bundle_v2"

      - name: Run isolated restore and role-boundary drill
        run: |
          set -euo pipefail
          restore_receipt="${RUNNER_TEMP}/agentops-byoc-restore.json"
          timeout 10m deploy/byoc/restore-drill.sh \
            "${AGENTOPS_BYOC_BACKUP_BUNDLE}" > "${restore_receipt}"
          jq -e '
            .ok == true
            and .contract == "agentops_byoc_restore_drill_v4"
            and .checksum_verified == true
            and .restore_provisioning_completed == true
            and .migration_manifest_verified == true
            and .schema_fingerprint_verified == true
            and .runtime_role_boundary_verified == true
            and .entitlement_admin_role_boundary_verified == true
            and .function_owner_boundary_verified == true
            and .isolated_role_dsns_file_backed == true
            and .production_overwritten == false
            and .restore_database_kept == false
            and .cleanup_confirmed == true
            and .credentials_omitted == true
          ' "${restore_receipt}" > /dev/null

          remaining="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              exec -T \
              -e "AGENTOPS_RESTORE_DATABASE=${AGENTOPS_RESTORE_DATABASE}" \
              postgres sh -ceu '
                psql \
                  --username "$POSTGRES_USER" \
                  --dbname "$POSTGRES_DB" \
                  --tuples-only \
                  --no-align \
                  --set=restore_database="$AGENTOPS_RESTORE_DATABASE"
              ' <<'SQL'
          SELECT count(*) FROM pg_database WHERE datname = :'restore_database';
          SQL
          )"
          test "${remaining}" = "0"
          echo "::notice title=BYOC restore drill::Committed backup restored into an isolated database; migration, fingerprint, runtime/admin/function-owner boundaries, file-backed role DSNs, and cleanup verified."

      - name: Run real same-schema retained-data lifecycle
        run: |
          set -euo pipefail
          lifecycle_dir="${AGENTOPS_BYOC_LIFECYCLE_STATE_DIR}"
          install -d -m 700 "${lifecycle_dir}"

          volume_name="$(
            docker volume ls \
              --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
              --filter "label=com.docker.compose.volume=agentops_postgres_data" \
              --format '{{.Name}}'
          )"
          test -n "${volume_name}"
          test "$(printf '%s\n' "${volume_name}" | wc -l | tr -d ' ')" = "1"
          volume_identity_before="$(
            docker volume inspect \
              --format '{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}' \
              "${volume_name}"
          )"
          cluster_identifier_before="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              exec -T postgres sh -ceu \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --tuples-only --no-align --command "SELECT system_identifier FROM pg_control_system()"'
          )"
          test -n "${cluster_identifier_before}"

          docker compose \
            --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
            -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
            exec -T \
            -e "ACCEPTANCE_AUTHORITY_ID=${AGENTOPS_BYOC_AUTHORITY_ID}" \
            postgres sh -ceu \
            'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --set=ON_ERROR_STOP=1 --set=authority_id="$ACCEPTANCE_AUTHORITY_ID"' <<'SQL'
          INSERT INTO audit_logs(
            audit_id,actor_type,actor_id,action,entity_type,entity_id,
            metadata_json,created_at
          ) VALUES (
            :'authority_id','system','byoc-compose-acceptance',
            'same_schema_lifecycle_authority','acceptance',:'authority_id',
            '{"authority":"pre_backup"}','2026-07-31T00:00:00.000Z'
          );
          SQL

          plan_receipt="${RUNNER_TEMP}/agentops-byoc-lifecycle-plan.json"
          timeout 5m deploy/byoc/retained-data-lifecycle.mjs plan \
            --to-image "${AGENTOPS_BYOC_TARGET_IMAGE}" > "${plan_receipt}"
          jq -e \
            --arg source_image "${AGENTOPS_BYOC_SOURCE_IMAGE}" \
            --arg source_id "${AGENTOPS_BYOC_SOURCE_IMAGE_ID}" \
            --arg target_image "${AGENTOPS_BYOC_TARGET_IMAGE}" \
            --arg target_id "${AGENTOPS_BYOC_TARGET_IMAGE_ID}" '
              .ok == true
              and .operation == "plan"
              and .phase == "planned"
              and .from_image_reference == $source_image
              and .from_image_id == $source_id
              and .to_image_reference == $target_image
              and .to_image_id == $target_id
              and .from_schema_contract == .to_schema_contract
              and .active_run_count == 0
              and .apply_blocked == false
              and .authority_database_bound == true
            ' "${plan_receipt}" > /dev/null
          operation_id="$(jq -er '.operation_id' "${plan_receipt}")"

          apply_receipt="${RUNNER_TEMP}/agentops-byoc-lifecycle-apply.json"
          timeout 20m deploy/byoc/retained-data-lifecycle.mjs apply \
            --plan-id "${operation_id}" > "${apply_receipt}"
          jq -e \
            --arg operation_id "${operation_id}" \
            --arg target_id "${AGENTOPS_BYOC_TARGET_IMAGE_ID}" '
              .ok == true
              and .operation == "apply"
              and .operation_id == $operation_id
              and .phase == "applied"
              and .image_id == $target_id
              and .backup_commit_marker == "agentops_byoc_backup_bundle_v2"
              and .active_run_preflight_passed == true
              and .configuration_preflight_passed == true
            ' "${apply_receipt}" > /dev/null

          control_plane_id="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              ps -q control-plane
          )"
          test "$(docker inspect --format '{{.Image}}' "${control_plane_id}")" = \
            "${AGENTOPS_BYOC_TARGET_IMAGE_ID}"

          authority_after_apply="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              exec -T \
              -e "ACCEPTANCE_AUTHORITY_ID=${AGENTOPS_BYOC_AUTHORITY_ID}" \
              postgres sh -ceu \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --tuples-only --no-align --set=authority_id="$ACCEPTANCE_AUTHORITY_ID" --command "SELECT count(*) FROM audit_logs WHERE audit_id=:'\''authority_id'\''"'
          )"
          test "${authority_after_apply}" = "1"

          docker compose \
            --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
            -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
            exec -T \
            -e "ACCEPTANCE_PROBE_ID=${AGENTOPS_BYOC_POST_APPLY_PROBE_ID}" \
            postgres sh -ceu \
            'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --set=ON_ERROR_STOP=1 --set=probe_id="$ACCEPTANCE_PROBE_ID"' <<'SQL'
          INSERT INTO audit_logs(
            audit_id,actor_type,actor_id,action,entity_type,entity_id,
            metadata_json,created_at
          ) VALUES (
            :'probe_id','system','byoc-compose-acceptance',
            'same_schema_lifecycle_post_apply_probe','acceptance',:'probe_id',
            '{"authority":"post_apply_only"}','2026-07-31T00:01:00.000Z'
          );
          SQL

          status_receipt="${RUNNER_TEMP}/agentops-byoc-lifecycle-status.json"
          deploy/byoc/retained-data-lifecycle.mjs status > "${status_receipt}"
          jq -e \
            --arg operation_id "${operation_id}" \
            --arg target_id "${AGENTOPS_BYOC_TARGET_IMAGE_ID}" '
              .ok == true
              and .operation == "status"
              and .state_present == true
              and .operation_locked == false
              and .state.operation.operation_id == $operation_id
              and .state.operation.phase == "applied"
              and .state.installation.image_id == $target_id
            ' "${status_receipt}" > /dev/null

          rollback_receipt="${RUNNER_TEMP}/agentops-byoc-lifecycle-rollback.json"
          timeout 20m deploy/byoc/retained-data-lifecycle.mjs rollback \
            --confirm-restore-from-backup "${operation_id}" > "${rollback_receipt}"
          jq -e \
            --arg operation_id "${operation_id}" \
            --arg source_id "${AGENTOPS_BYOC_SOURCE_IMAGE_ID}" '
              .ok == true
              and .operation == "rollback"
              and .operation_id == $operation_id
              and .phase == "rolled_back"
              and .image_id == $source_id
              and .backup_restore_authoritative == true
              and .down_migration_performed == false
              and .explicit_confirmation_verified == true
              and .quarantine_removed == true
              and .quarantine_cleanup_pending == false
            ' "${rollback_receipt}" > /dev/null

          authority_after_rollback="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              exec -T \
              -e "ACCEPTANCE_AUTHORITY_ID=${AGENTOPS_BYOC_AUTHORITY_ID}" \
              postgres sh -ceu \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --tuples-only --no-align --set=authority_id="$ACCEPTANCE_AUTHORITY_ID" --command "SELECT count(*) FROM audit_logs WHERE audit_id=:'\''authority_id'\''"'
          )"
          probe_after_rollback="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              exec -T \
              -e "ACCEPTANCE_PROBE_ID=${AGENTOPS_BYOC_POST_APPLY_PROBE_ID}" \
              postgres sh -ceu \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --tuples-only --no-align --set=probe_id="$ACCEPTANCE_PROBE_ID" --command "SELECT count(*) FROM audit_logs WHERE audit_id=:'\''probe_id'\''"'
          )"
          test "${authority_after_rollback}" = "1"
          test "${probe_after_rollback}" = "0"

          final_control_plane_id="$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              ps -q control-plane
          )"
          test "$(docker inspect --format '{{.Image}}' "${final_control_plane_id}")" = \
            "${AGENTOPS_BYOC_SOURCE_IMAGE_ID}"
          test "$(
            docker volume inspect \
              --format '{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}' \
              "${volume_name}"
          )" = "${volume_identity_before}"
          test "$(
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              exec -T postgres sh -ceu \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --tuples-only --no-align --command "SELECT system_identifier FROM pg_control_system()"'
          )" = "${cluster_identifier_before}"

          final_health="${RUNNER_TEMP}/agentops-byoc-lifecycle-final-health.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 2 \
            --output "${final_health}" \
            http://127.0.0.1:3001/api/mis/health
          jq -e '
            .ok == true
            and .status == "ready"
            and .control_plane == "typescript_postgres"
            and .schema_ready == true
            and .schema_fingerprint_verified == true
            and .database_role_boundary_verified == true
            and .python_proxy_performed == false
            and .sqlite_used == false
            and .credentials_omitted == true
          ' "${final_health}" > /dev/null

          echo "::notice title=BYOC same-schema lifecycle::Two immutable exact-source image digests with identical rootfs layers and distinct image IDs completed real plan/apply/backup-authoritative rollback on one retained PostgreSQL volume; pre-backup authority survived, the post-apply probe disappeared, source image/readiness/role boundaries recovered, and no volume reset occurred."

      - name: Record verified scope
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## BYOC Docker Compose acceptance

          Verified on an ephemeral Ubuntu runner:

          - clean image build and Compose startup;
          - production TypeScript/PostgreSQL health and schema fingerprint;
          - committed PostgreSQL backup bundle;
          - isolated restore provisioning, runtime/admin/function-owner boundaries, and cleanup.
          - real same-schema image `plan`/`apply`/backup-authoritative `rollback`;
          - one retained PostgreSQL volume and cluster identity across the lifecycle;
          - pre-backup authority retained and post-apply-only data removed by rollback;
          - exact source image, health, Schema readiness, and role boundaries restored.

          This acceptance uses two immutable images built from the exact same source and
          identical rootfs layers, with distinct OCI build-identity labels and image IDs.
          It does not validate image upgrade or rollback across Schema versions; the
          forward Schema upgrade gate remains open.
          EOF

      - name: Show bounded diagnostics on failure
        if: failure()
        run: |
          if [[ -n "${AGENTOPS_BYOC_ENV_FILE:-}" && -f "${AGENTOPS_BYOC_ENV_FILE}" ]]; then
            docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              ps --all || true

            diagnostics="$(
              docker compose \
                --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
                -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
                logs --no-color --tail 200 control-plane 2>/dev/null |
                grep -Eo \
                  'byoc_secret_preflight_failed:[a-z0-9_]+|"error_code":"[a-z0-9_]+"' |
                sort -u || true
            )"
            if [[ -n "${diagnostics}" ]]; then
              printf '%s\n' "${diagnostics}"
            else
              echo "No allowlisted control-plane error code was emitted."
            fi
          fi

      - name: Remove containers, acceptance volume, images, registry, and secrets
        if: always()
        run: |
          set +e
          cleanup_status=0
          if [[ -n "${AGENTOPS_BYOC_ENV_FILE:-}" && -f "${AGENTOPS_BYOC_ENV_FILE}" ]]; then
            timeout 5m docker compose \
              --env-file "${AGENTOPS_BYOC_ENV_FILE}" \
              -f "${AGENTOPS_BYOC_COMPOSE_FILE}" \
              down --volumes --remove-orphans --rmi local ||
              cleanup_status=$?
          fi
          for image in \
            "${AGENTOPS_BYOC_SOURCE_IMAGE:-}" \
            "${AGENTOPS_BYOC_TARGET_IMAGE:-}" \
            "${AGENTOPS_BYOC_SOURCE_IMAGE_TAG:-}" \
            "${AGENTOPS_BYOC_TARGET_IMAGE_TAG:-}"
          do
            if [[ -n "${image}" ]] && \
              docker image inspect "${image}" > /dev/null 2>&1
            then
              docker image rm --force "${image}" > /dev/null ||
                cleanup_status=$?
            fi
          done
          registry_container="${AGENTOPS_BYOC_REGISTRY_CONTAINER:-agentops-byoc-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          if docker container inspect "${registry_container}" > /dev/null 2>&1; then
            docker container rm --force "${registry_container}" > /dev/null ||
              cleanup_status=$?
          fi
          fallback_byoc_root="${RUNNER_TEMP}/agentops-byoc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${AGENTOPS_BYOC_ROOT:-${fallback_byoc_root}}" ||
            cleanup_status=$?
          rm -f -- \
            "${RUNNER_TEMP}/agentops-byoc-health.json" \
            "${RUNNER_TEMP}/agentops-byoc-backup.json" \
            "${RUNNER_TEMP}/agentops-byoc-restore.json" \
            "${RUNNER_TEMP}/agentops-byoc-lifecycle-plan.json" \
            "${RUNNER_TEMP}/agentops-byoc-lifecycle-apply.json" \
            "${RUNNER_TEMP}/agentops-byoc-lifecycle-status.json" \
            "${RUNNER_TEMP}/agentops-byoc-lifecycle-rollback.json" \
            "${RUNNER_TEMP}/agentops-byoc-lifecycle-final-health.json" ||
            cleanup_status=$?
          exit "${cleanup_status}"
