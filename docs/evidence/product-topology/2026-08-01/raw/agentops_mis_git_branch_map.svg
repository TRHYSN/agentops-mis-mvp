  </style>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>

<text x="65" y="68" font-size="44" font-weight="800" fill="#0F172A" text-anchor="start">AgentOps MIS：Git 分支 / PR / 产品线关系图</text>
<text x="65" y="107" font-size="23" font-weight="400" fill="#475569" text-anchor="start">分支是施工隔离单元；只有合并到 main 或经审核晋升，才改变当前代码事实。</text>
<rect x="1940" y="42" width="370" height="42" rx="21.0" fill="#0F172A" fill-opacity="1" stroke="#0F172A" stroke-width="1"/>
<text x="2125.0" y="70.97999999999999" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Evidence 2026-07-29</text>
<rect x="65" y="140" width="720" height="90" rx="16" fill="#DBEAFE" fill-opacity="1" stroke="#1D4ED8" stroke-width="2"/>
<text x="83" y="174" font-size="22" font-weight="850" fill="#1D4ED8" text-anchor="start">产品线</text>
<text x="83" y="205" font-size="17" font-weight="400" fill="#334155" text-anchor="start">长期支持的产品边界：Free Local / Private Host / Commercial / Research Lab</text>
<rect x="835" y="140" width="720" height="90" rx="16" fill="#E2E8F0" fill-opacity="1" stroke="#475569" stroke-width="2"/>
<text x="853" y="174" font-size="22" font-weight="850" fill="#475569" text-anchor="start">Git 分支</text>
<text x="853" y="205" font-size="17" font-weight="400" fill="#334155" text-anchor="start">某个 Work Package 的临时隔离施工线，不等于一个新产品</text>
<rect x="1605" y="140" width="720" height="90" rx="16" fill="#D1FAE5" fill-opacity="1" stroke="#047857" stroke-width="2"/>
<text x="1623" y="174" font-size="22" font-weight="850" fill="#047857" text-anchor="start">模块线</text>
<text x="1623" y="205" font-size="17" font-weight="400" fill="#334155" text-anchor="start">UI、Runtime、Relay、Template 等横切能力，可跨产品线复用</text>
<text x="65" y="285" font-size="26" font-weight="800" fill="#0F172A" text-anchor="start">Canonical code trunk</text>
<rect x="65" y="310" width="2270" height="172" rx="22" fill="#FFFFFF" fill-opacity="1" stroke="#2563EB" stroke-width="3" filter="url(#shadow)"/>
<rect x="90" y="334" width="120" height="38" rx="19.0" fill="#2563EB" fill-opacity="1" stroke="#2563EB" stroke-width="1"/>
<text x="150.0" y="360.22" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">main</text>
<text x="235" y="363" font-size="19" font-weight="750" fill="#0F172A" text-anchor="start" class="mono">2a3280b2c07551665a4813e840ef1e82c249e9d2</text>
<text x="235" y="398" font-size="23" font-weight="800" fill="#0F172A" text-anchor="start">Integrate Private Host with the Codex product bridge (#112)</text>
<text x="235" y="430" font-size="18" font-weight="400" fill="#475569" text-anchor="start">
<tspan x="235" dy="0">当前 main 同时包含：Free Local 基线、Private Host/Relay 能力、Codex Product Bridge、Research Lab incubator。</tspan>
<tspan x="235" dy="26">因此这些不是四个相互隔离的仓库；它们在同一 repo 内以模块和产品边界共存。</tspan>
</text>
<text x="65" y="545" font-size="26" font-weight="800" fill="#0F172A" text-anchor="start">重要施工线与历史线</text>
<rect x="65" y="575" width="710" height="245" rx="20" fill="#F5F3FF" fill-opacity="1" stroke="#7C3AED" stroke-width="2.5" filter="url(#shadow)"/>
<text x="85" y="611" font-size="23" font-weight="850" fill="#7C3AED" text-anchor="start">商业 clean-room 主施工线</text>
<rect x="570" y="591" width="185" height="30" rx="15.0" fill="#7C3AED" fill-opacity="1" stroke="#7C3AED" stroke-width="1"/>
<text x="662.5" y="611.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">未来候选产品线</text>
<text x="85" y="648" font-size="16.5" font-weight="700" fill="#334155" text-anchor="start" class="mono">
<tspan x="85" dy="0">codex/commercial-control-plane-main-integration</tspan>
</text>
<text x="85" y="686" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="start">PR #110 · Draft · 59 commits</text>
<text x="85" y="717" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">
<tspan x="85" dy="0">从新 main 重新建立生产 owner。</tspan>
<tspan x="85" dy="24">Next.js 16 / TypeScript / PostgreSQL 16 / TS Worker。</tspan>
<tspan x="85" dy="24">d3b9e73 有真实 Hermes/OpenClaw proof；仍未 release-ready。</tspan>
</text>
<rect x="845" y="575" width="710" height="245" rx="20" fill="#FEF2F2" fill-opacity="1" stroke="#B91C1C" stroke-width="2.5" filter="url(#shadow)"/>
<text x="865" y="611" font-size="23" font-weight="850" fill="#B91C1C" text-anchor="start">旧商业闭环历史线</text>
<rect x="1350" y="591" width="185" height="30" rx="15.0" fill="#B91C1C" fill-opacity="1" stroke="#B91C1C" stroke-width="1"/>
<text x="1442.5" y="611.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">参考，不是祖先合并</text>
<text x="865" y="648" font-size="16.5" font-weight="700" fill="#334155" text-anchor="start" class="mono">
<tspan x="865" dy="0">codex/commercial-migration-closed-loop</tspan>
</text>
<text x="865" y="686" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="start">PR #22 · Draft / historical</text>
<text x="865" y="717" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">
<tspan x="865" dy="0">早期商业迁移与 evidence/receipt 设计积累。</tspan>
<tspan x="865" dy="24">已经与 current main 分叉。</tspan>
<tspan x="865" dy="24">仅作为证据与参考，不能整条 merge/rebase 进新商业线。</tspan>
</text>
<rect x="1625" y="575" width="710" height="245" rx="20" fill="#F1F5F9" fill-opacity="1" stroke="#475569" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1645" y="611" font-size="23" font-weight="850" fill="#475569" text-anchor="start">UI v2 / Mission Control</text>
<rect x="2130" y="591" width="185" height="30" rx="15.0" fill="#475569" fill-opacity="1" stroke="#475569" stroke-width="1"/>
<text x="2222.5" y="611.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">前端横切线</text>
<text x="1645" y="648" font-size="16.5" font-weight="700" fill="#334155" text-anchor="start" class="mono">
<tspan x="1645" dy="0">design/gemini-ui-v2-implementation</tspan>
</text>
<text x="1645" y="686" font-size="16" font-weight="800" fill="#475569" text-anchor="start">PR #11 · Draft</text>
<text x="1645" y="717" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">
<tspan x="1645" dy="0">只改语义 token、AppShell、导航、Mission Control、Pixel preview。</tspan>
<tspan x="1645" dy="24">不改 backend / auth / approval / worker / runtime / DB。</tspan>
<tspan x="1645" dy="24">因此它是展示层分支，不是新的控制面产品线。</tspan>
</text>
<rect x="65" y="855" width="710" height="245" rx="20" fill="#FFF7ED" fill-opacity="1" stroke="#D97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="85" y="891" font-size="23" font-weight="850" fill="#D97706" text-anchor="start">Research Lab 模板/嵌入线</text>
<rect x="570" y="871" width="185" height="30" rx="15.0" fill="#D97706" fill-opacity="1" stroke="#D97706" stroke-width="1"/>
<text x="662.5" y="891.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">垂直模块线</text>
<text x="85" y="928" font-size="16.5" font-weight="700" fill="#334155" text-anchor="start" class="mono">
<tspan x="85" dy="0">template/research-lab-embedded-v0</tspan>
</text>
<text x="85" y="966" font-size="16" font-weight="800" fill="#D97706" text-anchor="start">Active branch</text>
<text x="85" y="997" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">
<tspan x="85" dy="0">Standalone incubator 已经通过 PR #32 进入 main。</tspan>
<tspan x="85" dy="24">该分支用于把科研能力包装成可嵌入模板。</tspan>
<tspan x="85" dy="24">科研协议账本与 MIS 权威边界仍需保持隔离。</tspan>
</text>
<rect x="845" y="855" width="710" height="245" rx="20" fill="#ECFDF5" fill-opacity="1" stroke="#0F766E" stroke-width="2.5" filter="url(#shadow)"/>
<text x="865" y="891" font-size="23" font-weight="850" fill="#0F766E" text-anchor="start">Private Host / Codex 桥接施工线</text>
<rect x="1350" y="871" width="185" height="30" rx="15.0" fill="#0F766E" fill-opacity="1" stroke="#0F766E" stroke-width="1"/>
<text x="1442.5" y="891.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">已并入主干</text>
<text x="865" y="928" font-size="16.5" font-weight="700" fill="#334155" text-anchor="start" class="mono">
<tspan x="865" dy="0">codex/private-host-codex-bridge-integration</tspan>
<tspan x="865" dy="22">codex/codex-mis-product-bridge</tspan>
</text>
<text x="865" y="988" font-size="16" font-weight="800" fill="#0F766E" text-anchor="start">Useful work merged by PR #112</text>
<text x="865" y="1019" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">
<tspan x="865" dy="0">分支名仍可能显示 active，但核心结果已合入 main。</tspan>
<tspan x="865" dy="24">继续存在的 branch 不是第二个产品事实。</tspan>
<tspan x="865" dy="24">后续判断应以 main exact SHA 与 PR/CI 为准。</tspan>
</text>
<rect x="1625" y="855" width="710" height="245" rx="20" fill="#ECFEFF" fill-opacity="1" stroke="#0891B2" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1645" y="891" font-size="23" font-weight="850" fill="#0891B2" text-anchor="start">Remote Console / Relay 施工线</text>
<rect x="2130" y="871" width="185" height="30" rx="15.0" fill="#0891B2" fill-opacity="1" stroke="#0891B2" stroke-width="1"/>
<text x="2222.5" y="891.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">部署横切线</text>
<text x="1645" y="928" font-size="16.5" font-weight="700" fill="#334155" text-anchor="start" class="mono">
<tspan x="1645" dy="0">codex/local-host-remote-console</tspan>
</text>
<text x="1645" y="966" font-size="16" font-weight="800" fill="#0891B2" text-anchor="start">Active branch / ops lane</text>
<text x="1645" y="997" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">
<tspan x="1645" dy="0">负责浏览器远程操控、Relay、服务生命周期与恢复。</tspan>
<tspan x="1645" dy="24">它扩展 Private Host 的传输/运维边界。</tspan>
<tspan x="1645" dy="24">不拥有 Task/Run/Audit 等业务权威。</tspan>
</text>
