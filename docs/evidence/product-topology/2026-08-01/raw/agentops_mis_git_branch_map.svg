<path d="M 1200 482 C 1200 525, 1200 535, 1200 565" stroke="#B91C1C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8" marker-end="url(#arrow)" fill="none" opacity="1"/>
<path d="M 1950 482 C 1950 525, 1980 535, 1980 565" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#arrow)" fill="none" opacity="1"/>
<rect x="65" y="1130" width="2270" height="58" rx="14" fill="#0F172A" fill-opacity="1" stroke="#0F172A" stroke-width="2"/>
<text x="1200" y="1168" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">判定规则：看产品关系用架构图；看当前代码事实用 main exact SHA；看未合入工作用 Draft PR / branch。</text>
</svg>