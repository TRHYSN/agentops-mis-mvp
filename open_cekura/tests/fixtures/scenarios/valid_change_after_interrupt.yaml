schema_version: 1
id: appointment.change_after_interrupt
name: Change appointment after interruption
persona:
  language: en-US
  tone: impatient
  verbosity: short
initial_message: "I need to move my appointment."
goal:
  type: reschedule
challenges:
  - interrupt_after_turn: 2
  - change_constraint_after_turn: 3
